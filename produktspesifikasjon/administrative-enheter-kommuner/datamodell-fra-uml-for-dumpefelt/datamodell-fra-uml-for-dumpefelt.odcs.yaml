schema:
- name: Dumpefeltgrense
  physicalName: dumpefeltgrense
  logicalType: object
  physicalType: table
  description: 'grense for område/lokalitet for senking/dumping i sjø

    Boundary for area/site for scuttling/dumping at sea'
  customProperties:
  - property: sosiObjektType
    value: Dumpefeltgrense
  properties:
  - name: grense
    logicalType: object
    physicalType: geometry(LineString)
    required: true
    customProperties:
    - property: geometryType
      value: LineString
- name: Dumpefelt
  physicalName: dumpefelt
  logicalType: object
  physicalType: table
  description: 'et havområde der mudret materiale eller annet potensielt mer skadelig
    materiale, f.eks. eksplosiver, kjemisk avfall, er bevisst dumpet.

    A sea area where dredged material or other potentially more harmful material,
    e.g. explosives, chemical waste, is deliberately deposited.'
  customProperties:
  - property: sosiObjektType
    value: Dumpefelt
  - property: associations
    value:
    - role: avgrensesAvDumpefeltgrense
      target: Dumpefeltgrense
      cardinality: 0..*
  properties:
  - name: område
    logicalType: object
    physicalType: geometry(Surface)
    required: true
    customProperties:
    - property: geometryType
      value: Surface
  - name: dumpefelttype
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/temadata/maritim-infrastruktur/dumpefelttype
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: Dumpefelttype
    - property: asDictionary
      value: 'true'
    description: 'angivelse av hva som dumpes

      The category of the dumping ground.  Note:  S-57 CATDPG'
    required: true
  - name: sjøstatus
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/temadata/maritim-infrastruktur/sj%C3%B8status
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: Sjøstatus
    - property: asDictionary
      value: 'true'
    description: 'angivelse av status

      The status of the object used for maritime objects.  Note:  S-57 STATUS'
  - name: informasjonNorsk
    logicalType: string
    description: 'generell opplysning


      Merknad:

      mulighet til å legge inn utfyllende informasjon om objektet'
  - name: informasjonEngelsk
    logicalType: string
    description: 'generell opplysning


      Merknad:

      mulighet til å legge inn utfyllende informasjon om objektet'
  - name: oppdateringsdato
    logicalType: timestamp
    description: 'dato for siste endring på objektetdataene


      Merknad:

      Oppdateringsdato kan være forskjellig fra Datafangsdato ved at data som er registrert
      kan bufres en kortere eller lengre periode før disse legges inn i datasystemet
      (databasen).


      -Definition-

      Date and time at which this version of the spatial object was inserted or changed
      in the spatial data set.'
    required: true
  - name: datauttaksdato
    logicalType: timestamp
    description: 'dato for uttak fra en database


      Merknad:

      Skiller seg fra Kopidato ved at en ikke skiller på om det er uttak fra en originaldatabase
      eller en kopidatabase.'
    required: true
  - name: førsteDatafangstdato
    logicalType: timestamp
    description: 'dato når data ble registrert/observert/målt første gang, som utgangspunkt
      for første digitalisering


      Merknad:

      førsteDatafangstdato brukes hvis det er av interesse å forvalte informasjon
      om når en ble klar over objektet. Dette kan for eksempel gjelde datoen for første
      flybilde som var utgangspunkt for registrering i en database.'
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator, tildelt av dataleverendør/dataforvalter.
        Den lokale identifikatoren er unik innenfor navnerommet, ingen andre objekter
        har samme identifikator.


        NOTE: Det er data leverendørens ansvar å sørge for at denne lokale identifikatoren
        er unik innenfor navnerommet.'
      required: true
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til objektet, starter
        med to bokstavs kode jfr ISO 3166. Benytter understreking  ("_") dersom data
        produsenten ikke er assosiert med bare et land.


        NOTE 1 : Verdien for nanverom vil eies av den dataprodusent som har ansvar
        for de unike identifikatorene og vil registreres i "INSPIRE external  Object
        Identifier Namespaces Register"


        Eksempel: NO for Norge.'
      required: true
    description: unik identifikasjon av et objekt
    required: true
  - name: kvalitet
    logicalType: object
    properties:
    - name: målemetode
      logicalType: string
      authoritativeDefinitions:
      - url: https://register.geonorge.no/sosi-kodelister/generelle-konsepter/4.5/m%C3%A5lemetode
        type: businessDefinition
      customProperties:
      - property: sosiCodeList
        value: Målemetode
      - property: asDictionary
        value: 'true'
      description: metode for måling i grunnriss (x,y), og høyde (z) når metoden er
        den samme som ved måling i grunnriss
      required: true
    - name: nøyaktighet
      logicalType: integer
      description: 'punktstandardavviket i grunnriss for punkter samt tverravvik for
        linjer


        Merknad:

        Oppgitt i cm'
    description: 'beskrivelse av kvaliteten på stedfestingen


      Merknad: Denne er identisk med ..KVALITET i tidligere versjoner av SOSI.'
